<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Direksi Tigalapan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Tata letak: menu samping tetap + area kerja; ringkasan di atas, rincian di bawah. */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --panel-2:#f7f8fa; --ink:#12151c; --ink-2:#424855; --muted:#5d6471; --line:#e2e5eb;
  --accent:#2a5fcf; --accent-soft:#e8eefb; --accent-ink:#1f4aa5;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --target:#424855; --lm:#a9afba;
  --good:#0ca30c; --good-ink:#0b7a0b; --good-soft:#e6f4e6;
  --warn:#fab219; --warn-ink:#7f5300; --warn-soft:#fcf1d8;
  --bad:#d03b3b; --bad-ink:#b02d2d; --bad-soft:#fbe8e8;
  --font:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1015; --panel:#171a21; --panel-2:#1c2029; --ink:#eef0f4; --ink-2:#c2c7d1; --muted:#9ba2ae; --line:#2a2f3a;
    --accent:#7aa3f2; --accent-soft:#1c2945; --accent-ink:#b1c8f7;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --target:#c2c7d1; --lm:#5d6471;
    --good-ink:#62d062; --good-soft:#16281a; --warn-ink:#f4c35a; --warn-soft:#2d2512; --bad-ink:#f08a8a; --bad-soft:#321a1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1015; --panel:#171a21; --panel-2:#1c2029; --ink:#eef0f4; --ink-2:#c2c7d1; --muted:#9ba2ae; --line:#2a2f3a;
  --accent:#7aa3f2; --accent-soft:#1c2945; --accent-ink:#b1c8f7;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --target:#c2c7d1; --lm:#5d6471;
  --good-ink:#62d062; --good-soft:#16281a; --warn-ink:#f4c35a; --warn-soft:#2d2512; --bad-ink:#f08a8a; --bad-soft:#321a1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:11.5px}
.muted{color:var(--muted)}

/* Shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--panel) 239px,var(--line) 239px,var(--line) 240px,transparent 240px)}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:18px 12px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.logo b{display:block;font-size:14px}
.logo span{display:block;font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:14px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;min-height:38px}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--panel-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav a .tag{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.side-foot{margin-top:auto;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}

.main{min-width:0;display:flex;flex-direction:column}
.demo-bar{background:var(--warn-soft);color:var(--warn-ink);border-bottom:1px solid var(--line);padding:8px 24px;font-size:12.5px;font-weight:500;display:flex;gap:8px;align-items:center}
.demo-bar svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding:20px 24px 12px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500;color:var(--ink-2)}
.chip .dot{width:8px;height:8px;border-radius:50%}

.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:0 24px 16px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:500;color:var(--ink-2);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.field{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.field select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 30px 7px 10px;color:var(--ink);min-height:36px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.btn-reset{border:0;background:none;color:var(--accent-ink);font-weight:600;cursor:pointer;padding:6px 4px}

.content{padding:20px 24px 48px;display:flex;flex-direction:column;gap:16px}

/* Kartu & grid */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-h h2{font-size:15px;font-weight:600}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.code{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi-l{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink-2);font-size:12.5px;font-weight:500}
.kpi-v{font-size:24px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.kpi-s{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.kpi.hero{grid-column:span 2}
.kpi-s > .bar{flex:1 1 100%;margin:4px 0 2px}
.kpi.hero .kpi-v{font-size:34px}
.bar{height:8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;position:relative}
.bar > i{position:absolute;inset:0 auto 0 0;border-radius:999px}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--target)}
.d-up{color:var(--good-ink);font-weight:600}
.d-down{color:var(--bad-ink);font-weight:600}
.d-flat{color:var(--muted);font-weight:600}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px 2px 7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pill.good{background:var(--good-soft);color:var(--good-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}
.pill.info{background:var(--accent-soft);color:var(--accent-ink)}
.pill.neutral{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}

/* Insight */
.insight ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.insight li{display:flex;gap:10px;align-items:flex-start}
.insight li .sev{width:4px;align-self:stretch;border-radius:4px;flex:none}

/* Tabel */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--panel-2)}
.tbl th button{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.tbl th button[data-active="true"]{color:var(--ink)}
.tbl .name{font-weight:600}
.tbl .link{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.tbl .link:hover{color:var(--accent-ink);text-decoration:underline}
.mini{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.mini .bar{width:64px;height:6px}
.cell-st{border-radius:6px;padding:4px 8px;font-weight:600;font-size:12px;text-align:center}
.cell-st.good{background:var(--good-soft);color:var(--good-ink)}
.cell-st.warn{background:var(--warn-soft);color:var(--warn-ink)}
.cell-st.bad{background:var(--bad-soft);color:var(--bad-ink)}
.cell-st.none{color:var(--muted)}

/* Grafik */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--target) 0 4px,transparent 4px 7px)!important}
.legend i.box{width:10px;height:10px;border-radius:3px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:8px 10px;font-size:12px;min-width:150px;z-index:5;display:none}
.tip b{display:block;margin-bottom:4px;font-size:12px}
.tip .row{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .row span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip .sw{width:8px;height:8px;border-radius:2px;display:inline-block}

.hbars{display:flex;flex-direction:column;gap:12px}
.hb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.hb-row .lbl{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.hb-row .val{font-size:12.5px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.hb-row .track{grid-column:1/-1;height:10px;border-radius:5px;background:var(--panel-2);position:relative;overflow:hidden}
.hb-row .track i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.sw-b{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* Halaman struktur */
.note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:12px 14px;font-size:13px}
.note svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;margin-top:1px}
.spec{display:flex;flex-direction:column;gap:10px}
.spec dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;margin:0;font-size:12.5px}
.spec dt{color:var(--muted)}
.spec dd{margin:0;color:var(--ink-2)}
.ph{border:1px dashed var(--line);border-radius:10px;min-height:96px;display:grid;place-items:center;color:var(--muted);font-size:12.5px;text-align:center;padding:12px;background:repeating-linear-gradient(135deg,transparent 0 10px,var(--panel-2) 10px 20px)}

.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:38px}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
.form-row label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form-row input[type=number]{width:110px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel);min-height:38px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}

@media (max-width:1180px){ .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))} .g-3{grid-template-columns:1fr} }
@media (max-width:980px){ .g-2-1,.g-1-1{grid-template-columns:1fr} }
@media (max-width:860px){
  .app{grid-template-columns:1fr;background:none}
  .side{position:sticky;z-index:10;height:auto;flex-direction:row;align-items:center;padding:8px 12px;gap:12px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .logo span,.side-foot,.nav-label{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;flex:1;scrollbar-width:none}
  .nav-group{flex-direction:row;gap:2px}
  .nav a{white-space:nowrap;padding:7px 10px}
  .nav a .tag{display:none}
  .top,.filters,.content{padding-left:16px;padding-right:16px}
  .demo-bar{padding:8px 16px}
}
@media (max-width:520px){ .g-kpi{grid-template-columns:1fr} .kpi.hero{grid-column:auto} .kpi.hero .kpi-v{font-size:28px} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navigasi">
    <div class="logo"><div class="logo-mark" aria-hidden="true">TL</div><div><b>Tigalapan</b><span>Dashboard Direksi</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div><b style="color:var(--ink)">Sumber data</b></div>
      <div id="side-source">Mode demo</div>
    </div>
  </aside>
  <div class="main">
    <div class="demo-bar" role="status">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <span><b>DATA DEMO.</b> Semua angka adalah contoh, bukan data Moka. Struktur halaman, filter dan rumus KPI sudah siap disambung ke API.</span>
    </div>
    <header class="top">
      <div>
        <h1 id="page-title">Ringkasan</h1>
        <div class="sub" id="page-sub"></div>
      </div>
      <div class="top-right" id="top-right"></div>
    </header>
    <div class="filters" id="filters">
      <div class="seg" role="group" aria-label="Periode" id="f-period">
        <button type="button" data-v="kemarin">Kemarin</button>
        <button type="button" data-v="mtd">MTD</button>
        <button type="button" data-v="ytd">YTD</button>
      </div>
      <label class="field" for="f-brand">Brand
        <select id="f-brand"></select>
      </label>
      <label class="field" for="f-store">Toko
        <select id="f-store"></select>
      </label>
      <button type="button" class="btn-reset" id="f-reset">Hapus filter</button>
    </div>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   1. KONFIGURASI
   Ganti CONFIG.mode menjadi 'api' setelah backend siap. Browser TIDAK
   pernah memanggil Moka langsung: token Moka hanya disimpan di server.
   ===================================================================== */
const CONFIG = {
  mode: 'demo',               // 'demo' | 'api'
  apiBase: '/api',            // backend dashboard Anda (bukan api.mokapos.com)
  tzOffsetHours: 8,           // WITA
  thresholds: { green: 100, yellow: 90 }  // status pencapaian target (%)
};
try {
  const saved = JSON.parse(localStorage.getItem('tgl-thresholds') || 'null');
  if (saved && isFinite(saved.green) && isFinite(saved.yellow)) CONFIG.thresholds = saved;
} catch (e) { /* penyimpanan lokal tidak tersedia: pakai bawaan */ }

/* =====================================================================
   2. UTILITAS TANGGAL (semua tanggal = string ISO 'YYYY-MM-DD', WITA)
   ===================================================================== */
const DAY = 864e5;
const toDate = iso => new Date(iso + 'T00:00:00Z');
const toIso = d => d.toISOString().slice(0, 10);
const addDays = (iso, n) => toIso(new Date(toDate(iso).getTime() + n * DAY));
const diffDays = (a, b) => Math.round((toDate(b) - toDate(a)) / DAY);
const monthStart = iso => iso.slice(0, 8) + '01';
const monthEnd = iso => { const d = toDate(monthStart(iso)); d.setUTCMonth(d.getUTCMonth() + 1); d.setUTCDate(0); return toIso(d); };
const dow = iso => toDate(iso).getUTCDay();
const shiftYear = (iso, n) => { const y = +iso.slice(0, 4) + n; const md = iso.slice(5); return (md === '02-29') ? y + '-02-28' : y + '-' + md; };
const prevMonthSameDay = iso => {
  const d = toDate(monthStart(iso)); d.setUTCMonth(d.getUTCMonth() - 1);
  const start = toIso(d); const end = monthEnd(start);
  const day = Math.min(+iso.slice(8), +end.slice(8));
  return { from: start, to: start.slice(0, 8) + String(day).padStart(2, '0') };
};
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BULAN_PANJANG = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const fmtDate = iso => +iso.slice(8) + ' ' + BULAN[+iso.slice(5, 7) - 1] + ' ' + iso.slice(0, 4);
const fmtDateShort = iso => +iso.slice(8) + ' ' + BULAN[+iso.slice(5, 7) - 1];
const todayWita = () => toIso(new Date(Date.now() + CONFIG.tzOffsetHours * 36e5));

/* =====================================================================
   3. FORMAT ANGKA (Rupiah, persen)
   ===================================================================== */
const nf0 = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const rp = v => (v < 0 ? '−' : '') + 'Rp' + nf0.format(Math.abs(Math.round(v)));
const rpS = v => {
  if (v == null || !isFinite(v)) return '—';
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  if (a >= 1e9) return s + 'Rp' + nf2.format(a / 1e9) + ' M';
  if (a >= 1e6) return s + 'Rp' + nf1.format(a / 1e6) + ' jt';
  if (a >= 1e3) return s + 'Rp' + nf0.format(a / 1e3) + ' rb';
  return s + 'Rp' + nf0.format(a);
};
const pct = v => (v == null || !isFinite(v)) ? '—' : nf1.format(v * 100) + '%';
const num = v => (v == null || !isFinite(v)) ? '—' : nf0.format(Math.round(v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const DemoSource = (function(){
  function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const SEASON = [0.86, 0.84, 1.0, 1.02, 0.96, 0.98, 1.05, 0.97, 0.95, 0.98, 1.0, 1.22];
  const DOW = [1.3, 0.88, 0.86, 0.9, 0.92, 1.0, 1.22];
  const LEBARAN = { 2024: '2024-04-10', 2025: '2025-03-31', 2026: '2026-03-20', 2027: '2027-03-10', 2028: '2028-02-27' };
  let cache = null;

  function factor(store, iso, yearNow){
    const m = +iso.slice(5, 7) - 1, d = +iso.slice(8), y = +iso.slice(0, 4);
    let f = SEASON[m] * DOW[dow(iso)] * ((d >= 25 || d <= 3) ? 1.08 : 1);
    const leb = LEBARAN[y];
    if (leb) { const k = diffDays(leb, iso); if (k >= -14 && k <= -1) f *= 1.5; else if (k >= 0 && k <= 1) f *= 0.4; }
    if (y === yearNow) f *= 1 + store.g;
    return store.base * f;
  }
  function targetFactor(store, iso){
    const m = +iso.slice(5, 7) - 1, d = +iso.slice(8), y = +iso.slice(0, 4);
    let f = SEASON[m] * DOW[dow(iso)] * ((d >= 25 || d <= 3) ? 1.08 : 1);
    const leb = LEBARAN[y];
    if (leb) { const k = diffDays(leb, iso); if (k >= -14 && k <= -1) f *= 1.5; else if (k >= 0 && k <= 1) f *= 0.4; }
    return store.base * f * 1.10;  // target = pola musiman tahun lalu + 10%
  }

  function build(asOf){
    const yearNow = +asOf.slice(0, 4);
    const from = (yearNow - 1) + '-01-01';
    const r = rng(20261103);
    const sales = [], tx = [], targets = [];
    const failed = 'TK-PLU';  // contoh outlet gagal sinkron: data kemarin belum masuk
    for (let iso = from; iso <= asOf; iso = addDays(iso, 1)) {
      for (const s of MASTER.stores) {
        if (iso < s.open) continue;
        if (s.id === failed && iso === asOf) continue;
        const exp = factor(s, iso, yearNow) * (0.82 + r() * 0.36);
        let storeNet = 0, storeQty = 0;
        for (const [brand, bshare] of Object.entries(s.mix)) {
          for (const c of MASTER.categories.filter(c => c.brand === brand)) {
            const net = exp * bshare * c.share * (0.9 + r() * 0.2);
            const dr = (brand === 'TK' ? 0.012 : brand === 'MYNO' ? 0.03 : 0.04) * (r() * 2);
            const rr = r() < 0.01 ? 0.15 : 0.012 * r();
            const gross = net / (1 - dr - rr);
            const disc = gross * dr, refund = gross * rr;
            const qty = Math.max(0, Math.round(gross / c.price));
            const qtyRef = Math.round(refund / c.price);
            const cogs = net * (c.hpp + (r() - 0.5) * 0.04);
            sales.push({ d: iso, store: s.id, brand, cat: c.id, gross, disc, refund, net, cogs, qty, qtyRef });
            storeNet += net; storeQty += qty - qtyRef;
          }
        }
        const basket = s.brand === 'TK' ? 1.7 : 1.9;
        const notaTotal = Math.max(1, Math.round(storeQty / basket));
        const weekend = dow(iso) === 0 || dow(iso) === 6;
        const netShare = weekend ? { retail: .6, b2b: .22, invoice: .12, event: .06 } : { retail: .64, b2b: .23, invoice: .13, event: 0 };
        const notaShare = weekend ? { retail: .85, b2b: .09, invoice: .03, event: .03 } : { retail: .87, b2b: .1, invoice: .03, event: 0 };
        for (const t of TX_TYPES) {
          if (!netShare[t.id]) continue;
          tx.push({ d: iso, store: s.id, type: t.id, nota: Math.max(0, Math.round(notaTotal * notaShare[t.id])), net: storeNet * netShare[t.id] });
        }
      }
    }
    for (let iso = yearNow + '-01-01', end = yearNow + '-12-31'; iso <= end; iso = addDays(iso, 1)) {
      for (const s of MASTER.stores) {
        if (iso < s.open) continue;
        const t = targetFactor(s, iso);
        for (const [brand, bshare] of Object.entries(s.mix)) targets.push({ d: iso, store: s.id, brand, target: t * bshare });
      }
    }
    // Produk: bobot tetap per SKU + tren per SKU (untuk pertumbuhan vs bulan lalu)
    const COLORS = [['HITAM','106'],['PUTIH','093'],['NAVY','066'],['MAROON','003'],['SKY BLUE','052'],['MUSTARD','023'],['ABU MISTY','099'],['HIJAU BTL','045'],['LILAC','071'],['BEIGE','076'],['MERAH CABE','001'],['KUNING KNR','027']];
    const SIZES = [['S','02'],['M','03'],['L','04'],['XL','05']];
    const products = [];
    const pr = rng(77);
    for (const c of MASTER.categories) {
      const label = c.id === 'COMBED 24S' ? '24S PDK' : c.id === 'COMBED 30S' ? '30S PDK' : c.id === 'WANGKI MYNO' ? 'WK MYNO PDK' : c.id === 'KAOS MAMU' ? 'MAMU PDK' : 'MAMU KID';
      COLORS.forEach(([col, cc], i) => SIZES.forEach(([sz, sc], j) => {
        if (pr() < 0.35) return;
        products.push({ sku: c.code + '-' + cc + 'A' + sc, name: col + ' ' + label + ' ' + sz, cat: c.id, brand: c.brand, w: Math.pow(0.82, i) * [0.8, 1.2, 1.1, 0.7][j] * (0.6 + pr() * 0.8), trend: (pr() - 0.45) * 0.6 });
      }));
    }
    const nowHHMM = (h, m) => String(h).padStart(2, '0') + '.' + String(m).padStart(2, '0');
    const sync = MASTER.stores.map((s, i) => s.id === failed
      ? { store: s.id, status: 'gagal', lastOk: addDays(asOf, -1), time: '06.12', rows: 0, message: 'Token akses kedaluwarsa (contoh pesan)' }
      : { store: s.id, status: 'berhasil', lastOk: addDays(asOf, 1), time: nowHHMM(6, 2 + i), rows: sales.filter(x => x.d === asOf && x.store === s.id).length, message: '' });
    return { sales, tx, targets, products, sync };
  }
  return {
    async load({ asOf }) { if (!cache) cache = build(asOf); return cache; }
  };
})();

  const hit = el('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: 'transparent' }, svg);
  function move(ev){
    const b = svg.getBoundingClientRect(); const sx = (ev.clientX - b.left) * (W / b.width);
    const i = Math.max(0, Math.min(n - 1, Math.round((sx - m.l) / ((W - m.l - m.r) / Math.max(1, n - 1)))));
    guide.setAttribute('x1', X(i)); guide.setAttribute('x2', X(i)); guide.setAttribute('visibility', 'visible');
    cfg.series.forEach((s, k) => { const v = s.values[i]; if (v == null) dots[k].setAttribute('visibility', 'hidden'); else { dots[k].setAttribute('cx', X(i)); dots[k].setAttribute('cy', Y(v)); dots[k].setAttribute('visibility', 'visible'); } });
    tip.innerHTML = tipHtml(cfg.tipTitle ? cfg.tipTitle(cfg.labels[i], i) : cfg.labels[i], cfg.series.filter(s => s.values[i] != null).map(s => ({ name: s.name, color: s.color, value: rpS(s.values[i]) })));
    placeTip(tip, host, X(i) * b.width / W, 8);
  }
  hit.addEventListener('mousemove', move);
  hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; guide.setAttribute('visibility', 'hidden'); dots.forEach(d => d.setAttribute('visibility', 'hidden')); });
}

function barChart(host, cfg){
  host.innerHTML = '';
  const W = Math.max(280, host.clientWidth), H = cfg.height || 240;
  const m = { l: 64, r: 12, t: 10, b: 26 };
  const n = cfg.labels.length;
  const maxV = niceMax(Math.max(1, ...cfg.values.filter(v => v != null), ...cfg.targets));
  const band = (W - m.l - m.r) / n;
  const X = i => m.l + i * band;
  const Y = v => H - m.b - v / maxV * (H - m.t - m.b);
  const svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': cfg.aria || '' }, host);
  for (let k = 0; k <= 4; k++) {
    const v = maxV * k / 4;
    el('line', { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: 'var(--line)', 'stroke-width': 1 }, svg);
    el('text', { x: m.l - 8, y: Y(v) + 4, 'text-anchor': 'end' }, svg).textContent = rpS(v).replace('Rp', '');
  }
  const bw = Math.max(3, Math.min(22, band * 0.62));
  const tip = document.createElement('div'); tip.className = 'tip'; host.appendChild(tip);
  cfg.labels.forEach((lb, i) => {
    const cx = X(i) + band / 2, v = cfg.values[i], t = cfg.targets[i];
    if (v != null && v > 0) {
      const y = Y(v), h = H - m.b - y, r = Math.min(4, bw / 2, h);
      el('path', { d: 'M' + (cx - bw / 2) + ' ' + (H - m.b) + 'V' + (y + r) + 'Q' + (cx - bw / 2) + ' ' + y + ' ' + (cx - bw / 2 + r) + ' ' + y + 'H' + (cx + bw / 2 - r) + 'Q' + (cx + bw / 2) + ' ' + y + ' ' + (cx + bw / 2) + ' ' + (y + r) + 'V' + (H - m.b) + 'Z', fill: cfg.color || 'var(--series-1)' }, svg);
    }
    if (t > 0) el('line', { x1: cx - bw / 2 - 2, x2: cx + bw / 2 + 2, y1: Y(t), y2: Y(t), stroke: 'var(--target)', 'stroke-width': 2, 'stroke-linecap': 'round', opacity: v == null ? .45 : 1 }, svg);
    const every = Math.max(1, Math.ceil(n / 12));
    if (i % every === 0 || i === n - 1) el('text', { x: cx, y: H - 8, 'text-anchor': 'middle' }, svg).textContent = cfg.xFmt ? cfg.xFmt(lb) : lb;
    const hit = el('rect', { x: X(i), y: m.t, width: band, height: H - m.t - m.b, fill: 'transparent' }, svg);
    hit.addEventListener('mousemove', () => {
      const b = svg.getBoundingClientRect();
      const rows = [{ name: 'Aktual', color: cfg.color || 'var(--series-1)', value: v == null ? 'belum ada' : rpS(v) }, { name: 'Target', color: 'var(--target)', value: rpS(t) }];
      if (v != null && t > 0) rows.push({ name: 'Capai', value: pct(v / t) });
      tip.innerHTML = tipHtml(cfg.tipTitle ? cfg.tipTitle(lb) : lb, rows);
      placeTip(tip, host, cx * b.width / W, 8);
    });
    hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });
}

function card(title, sub, code, body, extra){ return '<section class="card ' + (extra || '') + '"><div class="card-h"><div><h2>' + title + '</h2>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' + (code ? '<span class="code" title="Nomor di Daftar Informasi Dashboard Direktur">' + code + '</span>' : '') + '</div>' + body + '</section>'; }
function kpi(label, code, value, lines, cls){ return '<section class="card kpi ' + (cls || '') + '"><div class="kpi-l"><span>' + label + '</span>' + (code ? '<span class="code">' + code + '</span>' : '') + '</div><div class="kpi-v">' + value + '</div>' + lines.map(l => '<div class="kpi-s">' + l + '</div>').join('') + '</section>'; }

function storeName(id){ const s = storeOf(id); return s ? s.name.replace('TIGALAPANKAOS', 'TK') : id; }

/* ---------- Ringkasan ---------- */
function pageRingkasan(){
  const P = periods(), f = filt();
  const mtd = sumSales(P.mtd, f), lm = sumSales(P.lm, f), lyM = sumSales(P.lyMtd, f);
  const ytd = sumSales(P.ytd, f), lyY = sumSales(P.lyYtd, f);
  const tM = sumTarget(P.mtd, f), tY = sumTarget(P.ytd, f), tMonth = sumTarget(P.month, f);
  const lfl = lflStores(P.lyMtd.from);
  const mtdL = sumSales(P.mtd, Object.assign({}, f, { stores: lfl })), lyML = sumSales(P.lyMtd, Object.assign({}, f, { stores: lfl }));
  const yest = sumSales(P.day, f);
  const avg4 = [1, 2, 3, 4].map(k => sumSales({ from: addDays(ASOF, -7 * k), to: addDays(ASOF, -7 * k) }, f).net).reduce((a, b) => a + b, 0) / 4;
  const avg30 = sumSales(P.last30, f).net / 30;
  const need = P.remDays > 0 ? Math.max(0, tMonth - mtd.net) / P.remDays : null;
  const txM = sumTx(P.mtd, f), txLM = sumTx(P.lm, f);
  const brandAll = state.brand === 'all';
  const aov = brandAll && txM.nota ? txM.net / txM.nota : null, aovLM = brandAll && txLM.nota ? txLM.net / txLM.nota : null;
  const failed = DB.sync.filter(s => s.status !== 'berhasil' && (state.store === 'all' || s.store === state.store));

  // Peringkat toko MTD
  const byStore = groupSales(P.mtd, f, x => x.store), tByStore = groupTarget(P.mtd, f, x => x.store), lyByStore = groupSales(P.lyMtd, f, x => x.store);
  const rows = storesForBrand(state.brand).filter(s => state.store === 'all' || s.id === state.store).map(s => {
    const a = byStore.get(s.id) || { net: 0 }, t = tByStore.get(s.id) || 0, ly = lyByStore.get(s.id);
    return { id: s.id, net: a.net, t, p: t ? a.net / t : null, lfl: lfl.has(s.id) && ly ? growth(a.net, ly.net) : null };
  });
  const sorted = rows.slice().sort((a, b) => (b.p || 0) - (a.p || 0));
  const below = rows.filter(r => status(r.p) === 'bad');
  const negLfl = rows.filter(r => r.lfl != null && r.lfl < 0).sort((a, b) => a.lfl - b.lfl);

  // Insight otomatis — kalimat dari angka, bukan teks tetap
  const ins = [];
  const pM = tM ? mtd.net / tM : null;
  ins.push({ s: status(pM), t: 'Penjualan bersih MTD <b>' + rpS(mtd.net) + '</b>, ' + pct(pM) + ' dari target ' + rpS(tM) + '. ' + (need != null ? 'Untuk mencapai target bulan ini dibutuhkan <b>' + rpS(need) + '/hari</b> selama ' + P.remDays + ' hari tersisa, ' + (avg30 ? (need > avg30 ? nf0.format((need / avg30 - 1) * 100) + '% di atas' : nf0.format((1 - need / avg30) * 100) + '% di bawah') + ' rata-rata 30 hari terakhir.' : '') : 'Bulan ini sudah berakhir.') });
  if (state.store === 'all') {
    if (below.length) ins.push({ s: 'bad', t: '<b>' + below.length + ' toko</b> di bawah ' + CONFIG.thresholds.yellow + '% target: ' + below.sort((a, b) => a.p - b.p).map(r => esc(storeName(r.id)) + ' (' + pct(r.p) + ')').join(', ') + '.' });
    else ins.push({ s: 'good', t: 'Tidak ada toko di bawah ' + CONFIG.thresholds.yellow + '% target.' });
    if (negLfl.length) ins.push({ s: 'warn', t: 'Pertumbuhan LFL negatif vs tahun lalu di ' + negLfl.length + ' toko; terdalam ' + esc(storeName(negLfl[0].id)) + ' (' + pct(negLfl[0].lfl) + ').' });
  }
  ins.push({ s: avg4 && yest.net >= avg4 ? 'good' : 'warn', t: 'Penjualan kemarin (' + HARI[dow(ASOF)] + ', ' + fmtDateShort(ASOF) + ') ' + rpS(yest.net) + ', ' + dlt(growth(yest.net, avg4)) + ' dibanding rata-rata hari ' + HARI[dow(ASOF)] + ' 4 minggu terakhir.' });
  if (failed.length) ins.push({ s: 'bad', t: 'Data ' + failed.map(x => esc(storeName(x.store))).join(', ') + ' untuk ' + fmtDateShort(ASOF) + ' belum masuk (sinkron gagal). Angka kemarin dan MTD toko tersebut belum lengkap. <a href="#sinkronisasi">Lihat sinkronisasi</a>' });

  const sevColor = s => s === 'good' ? 'var(--good)' : s === 'warn' ? 'var(--warn)' : s === 'bad' ? 'var(--bad)' : 'var(--line)';
  let html = card('Yang perlu diketahui hari ini', 'Dihasilkan otomatis dari angka di halaman ini', '', '<ul>' + ins.map(i => '<li><span class="sev" style="background:' + sevColor(i.s) + '"></span><span>' + i.t + '</span></li>').join('') + '</ul>', 'insight');

  const pY = tY ? ytd.net / tY : null;
  html += '<div class="grid g-kpi">';
  html += kpi('Penjualan bersih MTD', '1.1 · 1.3', rpS(mtd.net), [
    'Target ' + rpS(tM) + ' ' + pill(pM),
    progress(pM),
    dlt(growth(mtd.net, lm.net), 'vs bulan lalu') + dlt(growth(mtd.net, lyM.net), 'vs tahun lalu') + dlt(growth(mtdL.net, lyML.net), 'LFL')
  ], 'hero');
  html += kpi('Penjualan bersih YTD', '1.2 · 1.3', rpS(ytd.net), ['Target ' + rpS(tY), pill(pY), dlt(growth(ytd.net, lyY.net), 'vs tahun lalu')]);
  html += kpi('Penjualan kemarin', '1.6', rpS(yest.net), [fmtDate(ASOF) + ' · ' + HARI[dow(ASOF)], dlt(growth(yest.net, avg4), 'vs rata-rata 4 ' + HARI[dow(ASOF)])]);
  html += kpi('Sisa kebutuhan per hari', '1.5', need == null ? '—' : rpS(need), [P.remDays + ' hari tersisa bulan ini', 'Rata-rata 30 hari: ' + rpS(avg30), need != null && avg30 ? (need > avg30 * 1.1 ? '<span class="pill bad">' + ICON.bad + 'Jauh di atas laju sekarang</span>' : need > avg30 ? '<span class="pill warn">' + ICON.warn + 'Sedikit di atas laju sekarang</span>' : '<span class="pill good">' + ICON.good + 'Terkejar dengan laju sekarang</span>') : '']);
  html += kpi('Nota dan rata-rata per nota MTD', '1.9 · 1.10', brandAll ? num(txM.nota) + ' <span class="muted" style="font-size:15px;font-weight:600">nota · AOV ' + rpS(aov) + '</span>' : '—', brandAll ? [dlt(growth(txM.nota, txLM.nota), 'nota vs bulan lalu'), dlt(growth(aov, aovLM), 'AOV vs bulan lalu')] : ['Nota tidak dipecah per brand: satu nota bisa berisi beberapa brand. Pilih semua brand.']);
  html += kpi('Pcs terjual MTD', '1.11', num(mtd.pcs), [dlt(growth(mtd.pcs, lm.pcs), 'vs bulan lalu'), 'Tanpa plastik dan item non-produk']);
  html += kpi('Laba kotor MTD', '', rpS(mtd.gp), ['Margin ' + pct(mtd.net ? mtd.gp / mtd.net : null) + ' · diskon ' + pct(mtd.gross ? mtd.disc / mtd.gross : null) + ' dari penjualan kotor']);
  html += '</div>';

  // Grafik kumulatif MTD vs target vs bulan lalu
  const days = []; for (let d = P.month.from; d <= P.month.to; d = addDays(d, 1)) days.push(d);
  const lmFrom = P.lm.from;
  const actByDay = groupSales(P.mtd, f, x => x.d), tByDay = groupTarget(P.month, f, x => x.d);
  const lmByDay = groupSales({ from: lmFrom, to: monthEnd(lmFrom) }, f, x => x.d);
  let ca = 0, ct = 0, cl = 0; const A = [], T = [], L = [];
  days.forEach((d, i) => {
    ct += tByDay.get(d) || 0; T.push(ct);
    if (d <= ASOF) { ca += (actByDay.get(d) || { net: 0 }).net; A.push(ca); } else A.push(null);
    const ld = lmFrom.slice(0, 8) + String(i + 1).padStart(2, '0');
    if (ld <= monthEnd(lmFrom)) { cl += (lmByDay.get(ld) || { net: 0 }).net; L.push(cl); } else L.push(null);
  });
  const legend = '<div class="legend"><span><i style="background:var(--accent)"></i>Aktual ' + BULAN[+ASOF.slice(5, 7) - 1] + '</span><span><i class="dash"></i>Target</span><span><i style="background:var(--lm)"></i>Bulan lalu</span></div>';
  html += '<div class="grid g-2-1">';
  html += card('Penjualan bersih kumulatif ' + BULAN_PANJANG[+ASOF.slice(5, 7) - 1], 'Garis target mengikuti pola musiman, bukan dibagi rata per hari', '1.1', legend + '<div class="chart" id="ch-cum"></div>');
  after.push(() => lineChart(document.getElementById('ch-cum'), { labels: days, height: 270, aria: 'Penjualan kumulatif bulan ini dibanding target dan bulan lalu', xFmt: d => +d.slice(8), tipTitle: d => fmtDate(d), series: [
    { name: 'Bulan lalu', values: L, color: 'var(--lm)', width: 2 },
    { name: 'Target', values: T, color: 'var(--target)', dash: true, width: 1.6 },
    { name: 'Aktual', values: A, color: 'var(--accent)', width: 2.4, area: true, endpoint: true }
  ] }));

  // Kontribusi brand
  const byBrand = groupSales(P.mtd, Object.assign({}, f, { brand: 'all' }), x => x.brand), tByBrand = groupTarget(P.mtd, Object.assign({}, f, { brand: 'all' }), x => x.brand);
  const tot = [...byBrand.values()].reduce((a, b) => a + b.net, 0);
  const bars = MASTER.brands.filter(b => byBrand.has(b.id)).map(b => {
    const a = byBrand.get(b.id), t = tByBrand.get(b.id) || 0, sh = tot ? a.net / tot : 0;
    const dim = state.brand !== 'all' && state.brand !== b.id;
    return '<div class="hb-row" style="opacity:' + (dim ? .45 : 1) + '"><div class="lbl"><span class="sw-b" style="background:' + b.color + '"></span>' + b.name + '</div><div class="val">' + rpS(a.net) + ' · ' + pct(sh) + '</div><div class="track"><i style="width:' + (sh * 100).toFixed(1) + '%;background:' + b.color + '"></i></div><div class="kpi-s" style="grid-column:1/-1">' + pill(t ? a.net / t : null) + '</div></div>';
  }).join('');
  html += card('Kontribusi brand MTD', 'Porsi penjualan bersih dan pencapaian target', '1.1', '<div class="hbars">' + (bars || '<div class="empty">Belum ada data.</div>') + '</div>');
  html += '</div>';

  // Toko: perhatian & terbaik
  const rowHtml = r => '<tr><td><button type="button" class="link" data-store="' + esc(r.id) + '">' + esc(storeName(r.id)) + '</button></td><td class="r">' + rpS(r.net) + '</td><td class="r"><div class="mini">' + pct(r.p) + progress(r.p) + '</div></td><td class="r">' + dlt(r.lfl) + '</td></tr>';
  const head = '<thead><tr><th>Toko</th><th class="r">Bersih MTD</th><th class="r">Capai target</th><th class="r">LFL vs LY</th></tr></thead>';
  html += '<div class="grid g-1-1">';
  html += card('Toko perlu perhatian', 'Pencapaian MTD terendah', '1.3', '<div class="tbl-wrap"><table class="tbl">' + head + '<tbody>' + sorted.slice().reverse().slice(0, 5).map(rowHtml).join('') + '</tbody></table></div>');
  html += card('Toko terbaik', 'Pencapaian MTD tertinggi', '1.3', '<div class="tbl-wrap"><table class="tbl">' + head + '<tbody>' + sorted.slice(0, 5).map(rowHtml).join('') + '</tbody></table></div>');
  html += '</div>';
  return html;
}

/* ---------- Penjualan ---------- */
function pagePenjualan(){
  const P = periods(), f = filt(), R = periodRange(state.period), C = compareRange(state.period);
  const LY = state.period === 'ytd' ? P.lyYtd : state.period === 'kemarin' ? { from: shiftYear(ASOF, -1), to: shiftYear(ASOF, -1) } : P.lyMtd;
  const days = []; for (let d = P.month.from; d <= P.month.to; d = addDays(d, 1)) days.push(d);
  const act = groupSales(P.mtd, f, x => x.d), tg = groupTarget(P.month, f, x => x.d);
  let html = card('Penjualan bersih harian, ' + BULAN_PANJANG[+ASOF.slice(5, 7) - 1] + ' ' + ASOF.slice(0, 4), 'Batang = aktual · garis pendek = target harian', '1.1 · 1.6',
    '<div class="legend"><span><i class="box" style="background:var(--series-1)"></i>Aktual</span><span><i style="background:var(--target)"></i>Target harian</span></div><div class="chart" id="ch-daily"></div>');
  after.push(() => barChart(document.getElementById('ch-daily'), { labels: days, height: 240, aria: 'Penjualan bersih harian bulan ini dan target harian', values: days.map(d => d <= ASOF ? (act.get(d) || { net: 0 }).net : null), targets: days.map(d => tg.get(d) || 0), xFmt: d => +d.slice(8), tipTitle: d => HARI[dow(d)] + ', ' + fmtDate(d) }));

  // Kategori × brand
  const cur = groupSales(R, f, x => x.brand + '|' + x.cat), cmp = groupSales(C, f, x => x.brand + '|' + x.cat), ly = groupSales(LY, f, x => x.brand + '|' + x.cat);
  const tot = [...cur.values()].reduce((a, b) => a + b.net, 0);
  const catRows = [...cur.entries()].sort((a, b) => b[1].net - a[1].net).map(([k, v]) => {
    const [b, c] = k.split('|'); const br = brandOf(b);
    return '<tr><td><span class="sw-b" style="background:' + br.color + ';margin-right:8px;display:inline-block;vertical-align:-1px"></span>' + esc(br.name) + '</td><td class="name">' + esc(c) + '</td><td class="r">' + rpS(v.net) + '</td><td class="r">' + dlt(growth(v.net, (cmp.get(k) || {}).net)) + '</td><td class="r">' + dlt(growth(v.net, (ly.get(k) || {}).net)) + '</td><td class="r">' + num(v.pcs) + '</td><td class="r">' + pct(tot ? v.net / tot : null) + '</td></tr>';
  }).join('');
  const cmpHead = state.period === 'kemarin' ? 'vs ' + HARI[dow(ASOF)] + ' lalu' : state.period === 'ytd' ? 'vs LY' : 'vs LM';

  const avg4 = new Map(); [1, 2, 3, 4].forEach(k => { const d = addDays(ASOF, -7 * k); groupSales({ from: d, to: d }, f, x => x.store).forEach((v, id) => avg4.set(id, (avg4.get(id) || 0) + v.net / 4)); });

/* ---------- Produk ---------- */
function pageProduk(){
  const f = filt(), R = periodRange(state.period), C = compareRange(state.period);
  const cat = groupSales(R, f, x => x.cat), catC = groupSales(C, f, x => x.cat);
  const items = [];
  for (const c of MASTER.categories) {
    const ps = DB.products.filter(p => p.cat === c.id); if (!ps.length || !cat.has(c.id)) continue;
    const wN = ps.reduce((a, p) => a + p.w * (1 + p.trend), 0), wO = ps.reduce((a, p) => a + p.w, 0);
    const a = cat.get(c.id), o = catC.get(c.id);
    ps.forEach(p => { const sh = p.w * (1 + p.trend) / wN; const net = a.net * sh; items.push({ p, net, pcs: a.pcs * sh, gp: a.gp * sh, g: o ? growth(net, o.net * p.w / wO) : null }); });
  }
  const tot = items.reduce((a, b) => a + b.net, 0);
  items.sort((a, b) => b.net - a.net);

  let html = '<div class="note"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg><span>' + s.intro + '</span></div><div class="grid g-1-1">';
  s.items.forEach(it => {
    const [no, title, per, cmp, freq, src, pic, rd] = it;
    html += '<section class="card spec"><div class="card-h"><div><h2>' + esc(title) + '</h2></div><span class="code">' + no + '</span></div>' +
      '<dl><dt>Dirinci per</dt><dd>' + esc(per) + '</dd><dt>Dibandingkan</dt><dd>' + esc(cmp) + '</dd><dt>Jadwal</dt><dd>' + esc(freq) + '</dd><dt>Sumber</dt><dd>' + esc(src) + ' · PIC ' + esc(pic) + '</dd></dl>' +
      '<div><span class="pill ' + READY[rd][0] + '">' + READY[rd][1] + '</span></div>' +
      '<div class="ph">Grafik dan tabel muncul di sini setelah sumber datanya tersambung</div></section>';
  });
  return html + '</div>';
}

/* ---------- Sinkronisasi ---------- */
function pageSync(){
  const ok = DB.sync.filter(s => s.status === 'berhasil').length, bad = DB.sync.length - ok;
  let html = '<div class="grid g-kpi">';
  html += kpi('Outlet tersinkron', '', ok + ' / ' + DB.sync.length, [bad ? '<span class="pill bad">' + ICON.bad + bad + ' gagal</span>' : '<span class="pill good">' + ICON.good + 'Semua berhasil</span>']);
  html += kpi('Data terakhir', '', fmtDate(ASOF), ['Penjualan s.d. kemarin, WITA']);
  html += kpi('Jadwal sinkron', '', '06.00 WITA', ['Setiap hari, tarik ulang 7 hari terakhir']);
  html += kpi('Batas tayang', '', '09.00 WITA', ['Data kemarin wajib masuk sebelum jam ini']);
  html += '</div>';
  html += card('Sinkron manual', 'Tombol aktif setelah backend dan Moka API tersambung', '', '<div class="btns"><button class="btn primary" type="button" disabled>Sinkron semua toko</button><button class="btn" type="button" disabled>Sinkron toko terpilih</button><button class="btn" type="button" disabled>Ulangi yang gagal</button><button class="btn" type="button" disabled>Tarik data historis</button></div>');
  const rows = DB.sync.map(s => '<tr><td class="name">' + esc(storeName(s.store)) + '</td><td>' + esc(storeOf(s.store).brand) + '</td><td>' + (s.status === 'berhasil' ? '<span class="pill good">' + ICON.good + 'Berhasil</span>' : '<span class="pill bad">' + ICON.bad + 'Gagal</span>') + '</td><td class="r">' + fmtDateShort(s.lastOk) + ', ' + s.time + '</td><td class="r">' + num(s.rows) + '</td><td class="muted" style="white-space:normal;min-width:180px">' + esc(s.message || '—') + '</td></tr>').join('');
  html += card('Status per outlet', 'Contoh data sinkron. Outlet yang gagal ditandai di seluruh dashboard', '', '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Outlet</th><th>Brand</th><th>Status</th><th class="r">Sinkron terakhir</th><th class="r">Baris item sales kemarin</th><th>Pesan</th></tr></thead><tbody>' + rows + '</tbody></table></div>');
  const ref = [['Jumlah baris SKU', '35'], ['Item sold / refunded', '187 / 17 pcs'], ['Penjualan kotor', 'Rp4.503.000'], ['Refund', '−Rp816.000'], ['Diskon', 'Rp0'], ['Penjualan bersih', 'Rp3.687.000'], ['HPP', 'Rp2.681.490'], ['Laba kotor', 'Rp1.005.510']];
  html += card('Uji rekonsiliasi: TIGALAPANKAOS Toraja, 2 Nov 2026', 'Nilai acuan diambil dari file export Report Item Sales (data asli). Kolom API terisi setelah koneksi berjalan; selisih harus Rp0', 'Gerbang 1',
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Pembanding</th><th class="r">File export Moka</th><th class="r">Moka API</th><th>Hasil</th></tr></thead><tbody>' + ref.map(r => '<tr><td>' + r[0] + '</td><td class="r">' + r[1] + '</td><td class="r muted">—</td><td><span class="pill neutral">Belum diuji</span></td></tr>').join('') + '</tbody></table></div>');
  return html;
}

/* ---------- Pengaturan ---------- */
function pagePengaturan(){
  let html = card('Ambang status pencapaian target', 'Mengubah warna status di seluruh dashboard. Disimpan di browser ini saja; nanti disimpan di server', '1.3',
    '<form id="th-form" class="form-row"><label for="th-green">Hijau jika ≥ (%)<input id="th-green" type="number" min="1" max="200" step="1" value="' + CONFIG.thresholds.green + '"></label><label for="th-yellow">Kuning jika ≥ (%)<input id="th-yellow" type="number" min="1" max="200" step="1" value="' + CONFIG.thresholds.yellow + '"></label><button class="btn primary" type="submit">Simpan</button><button class="btn" type="button" id="th-reset">Kembalikan 100 / 90</button><span id="th-msg" class="muted" role="status"></span></form>');
  html += card('Koneksi Moka', 'Kredensial disimpan di server, tidak pernah di browser', '',
    '<div class="tbl-wrap"><table class="tbl"><tbody>' +
    '<tr><td>Mode data</td><td><span class="pill warn">' + ICON.warn + 'Demo</span></td></tr>' +
    '<tr><td>Jalur API</td><td class="muted">Belum dipilih (Moka API atau GoBiz Direct Integration)</td></tr>' +
    '<tr><td>Client ID / secret</td><td class="muted">Belum tersimpan di server</td></tr>' +
    '<tr><td>Zona waktu</td><td>WITA (UTC+08:00)</td></tr>' +
    '<tr><td>Histori</td><td>Sejak 1 Januari ' + (+ASOF.slice(0, 4) - 1) + ' (untuk pembanding LY)</td></tr>' +
    '</tbody></table></div>');
  const api = [
    ['GET /api/sales/daily?from&to', 'tanggal, outlet, brand, kategori, kotor, diskon, refund, bersih, HPP, qty, qty refund', 'Moka item sales per outlet per hari + master SKU', '1.1–1.7, 1.11, 6.3'],
    ['GET /api/transactions/daily?from&to', 'tanggal, outlet, jenis transaksi, jumlah nota, bersih', 'Moka transaksi per nota, diringkas per hari', '1.8–1.10'],
    ['GET /api/targets/daily?year', 'tanggal, outlet, brand, target', 'Upload target bulanan, dipecah harian (musiman)', '1.3, 1.5'],
    ['GET /api/products?year', 'SKU, nama, kategori, brand, non-produk', 'Master SKU (SKU ALL UNITS)', '1.7, peringkat produk'],
    ['GET /api/sync/status', 'outlet, status, waktu sinkron, jumlah baris, pesan', 'Log sinkronisasi backend', 'Sinkronisasi']
  ];
  html += card('Kontrak data untuk backend', 'Halaman ini membaca lima endpoint milik backend Anda. Backend yang memanggil Moka API, menyimpan ke database, lalu menyajikan bentuk data ini', '',
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Endpoint</th><th>Kolom</th><th>Diisi dari</th><th>Dipakai untuk</th></tr></thead><tbody>' + api.map(a => '<tr><td class="mono">' + esc(a[0]) + '</td><td style="white-space:normal;min-width:220px">' + esc(a[1]) + '</td><td style="white-space:normal;min-width:180px">' + esc(a[2]) + '</td><td>' + esc(a[3]) + '</td></tr>').join('') + '</tbody></table></div>');
  return html;
}

/* =====================================================================
   8. NAVIGASI, FILTER, RENDER
   ===================================================================== */
function current(){ const h = location.hash.replace('#', ''); return PAGES.find(p => p.id === h) || PAGES[0]; }
function buildNav(){
  const groups = [...new Set(PAGES.map(p => p.group))];
  document.getElementById('nav').innerHTML = groups.map(g => '<div class="nav-group"><div class="nav-label">' + g + '</div>' + PAGES.filter(p => p.group === g).map(p => '<a href="#' + p.id + '" data-page="' + p.id + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + p.icon + '"/></svg><span>' + p.title + '</span>' + (p.tag ? '<span class="tag">' + p.tag + '</span>' : '') + '</a>').join('') + '</div>').join('');
}
function buildFilters(){
  const bs = document.getElementById('f-brand');
  bs.innerHTML = '<option value="all">Semua brand</option>' + MASTER.brands.map(b => '<option value="' + b.id + '">' + b.name + '</option>').join('');
  bs.value = state.brand;
  fillStores();
}
function fillStores(){
  const ss = document.getElementById('f-store');
  const list = storesForBrand(state.brand);
  if (state.store !== 'all' && !list.some(s => s.id === state.store)) state.store = 'all';
  ss.innerHTML = '<option value="all">Semua toko (' + list.length + ')</option>' + list.map(s => '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>').join('');
  ss.value = state.store;
}
function saveState(){ try { sessionStorage.setItem('tgl-filters', JSON.stringify({ period: state.period, brand: state.brand, store: state.store })); } catch (e) {} }

function render(){
  const pg = current();
  document.querySelectorAll('#nav a').forEach(a => a.setAttribute('aria-current', a.dataset.page === pg.id ? 'page' : 'false'));
  document.getElementById('page-title').textContent = pg.title;
  const scope = (state.brand === 'all' ? 'Semua brand' : 'Brand ' + state.brand) + ' · ' + (state.store === 'all' ? 'semua toko' : storeName(state.store));
  document.getElementById('page-sub').textContent = 'Data s.d. ' + HARI[dow(ASOF)] + ', ' + fmtDate(ASOF) + ' (WITA) · ' + scope;
  document.querySelectorAll('#f-period button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state.period)));
  const usesPeriod = ['penjualan', 'toko', 'produk'].includes(pg.id);
  document.getElementById('f-period').style.display = usesPeriod ? '' : 'none';
  document.getElementById('filters').style.display = ['sinkronisasi', 'pengaturan', 'pelanggan', 'kas-piutang', 'stok', 'lost-sales'].includes(pg.id) ? 'none' : '';
  const bad = DB.sync.filter(s => s.status !== 'berhasil').length;
  document.getElementById('top-right').innerHTML = '<span class="chip"><span class="dot" style="background:var(--warn)"></span>Mode demo</span><a class="chip" href="#sinkronisasi" style="text-decoration:none"><span class="dot" style="background:' + (bad ? 'var(--bad)' : 'var(--good)') + '"></span>Sinkron 06.00 WITA' + (bad ? ' · ' + bad + ' gagal' : '') + '</a>';
  after.length = 0;
  const content = document.getElementById('content');
  content.innerHTML = pg.render();
  after.forEach(fn => fn());
  wire(content);
}
function wire(root){
  root.querySelectorAll('[data-store]').forEach(b => b.addEventListener('click', () => { const s = storeOf(b.dataset.store); state.store = s.id; if (state.brand !== 'all' && !s.mix[state.brand]) state.brand = 'all'; buildFilters(); saveState(); location.hash = 'ringkasan'; render(); }));
  root.querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.sort; if (state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = (k === 'id' || k === 'brand') ? 1 : -1; } render(); }));
  const form = root.querySelector('#th-form');
  if (form) {
    form.addEventListener('submit', ev => {
      ev.preventDefault();
      const g = +root.querySelector('#th-green').value, y = +root.querySelector('#th-yellow').value, msg = root.querySelector('#th-msg');
      if (!(g > 0) || !(y > 0) || y >= g) { msg.textContent = 'Batas kuning harus lebih kecil dari batas hijau.'; return; }
      CONFIG.thresholds = { green: g, yellow: y };
      try { localStorage.setItem('tgl-thresholds', JSON.stringify(CONFIG.thresholds)); } catch (e) {}
      render(); const m2 = document.getElementById('th-msg'); if (m2) m2.textContent = 'Tersimpan. Status di semua halaman sudah diperbarui.';
    });
    root.querySelector('#th-reset').addEventListener('click', () => { CONFIG.thresholds = { green: 100, yellow: 90 }; try { localStorage.removeItem('tgl-thresholds'); } catch (e) {} render(); });
  }
}

document.getElementById('f-period').addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; state.period = b.dataset.v; saveState(); render(); });
document.getElementById('f-brand').addEventListener('change', ev => { state.brand = ev.target.value; fillStores(); saveState(); render(); });
document.getElementById('f-store').addEventListener('change', ev => { state.store = ev.target.value; saveState(); render(); });
document.getElementById('f-reset').addEventListener('click', () => { state.brand = 'all'; state.store = 'all'; state.period = 'mtd'; buildFilters(); saveState(); render(); });
window.addEventListener('hashchange', () => { render(); document.getElementById('content').focus({ preventScroll: true }); window.scrollTo(0, 0); });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 180); });

(async function init(){
  ASOF = addDays(todayWita(), -1);
  const source = CONFIG.mode === 'api' && typeof ApiSource !== 'undefined' ? ApiSource : DemoSource;
  DB = await source.load({ asOf: ASOF });
  document.getElementById('side-source').textContent = CONFIG.mode === 'demo' ? 'Mode demo · Moka API belum tersambung' : 'Moka API via backend';
  buildNav(); buildFilters(); render();
})();
})();
</script>
